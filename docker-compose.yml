services:
  # --- MARIADB (Primary business database) ---
  mariadb:
    platform: linux/amd64
    image: mariadb:11
    container_name: smart-logistic-project-mariadb-1
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: smart_logistics
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- BACKEND (Go API) ---
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9090"
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: root
      MARIADB_DB_NAME: smart_logistics
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: web-app-project
      KEYCLOAK_CLIENT_ID: fastapi_backend_client
      DEV_SKIP_AUTH: "false"
      REDIS_ENABLED: "false"
      FRONTEND_URL: http://localhost:3000
      AUTO_MIGRATE: "false"
    depends_on:
      mariadb:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - my-network

  # --- CỤM KEYCLOAK (Auth) ---
  postgres-keycloak:
    image: postgres:16
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - my-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak?sslmode=disable
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  keycloak_db_data:
  mariadb_data: